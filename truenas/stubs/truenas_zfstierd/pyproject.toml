[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "truenas-zfstierd"
version = "27.0.0"
description = "Clean-room stand-in for TrueNAS truenas_zfstierd_client/common: ZFS tiering is unavailable (awto-unvr #356)"
requires-python = ">=3.11"
license = {text = "GPL-2.0-or-later"}

[tool.setuptools]
packages = ["truenas_zfstierd_client", "truenas_zfstierd_common"]
