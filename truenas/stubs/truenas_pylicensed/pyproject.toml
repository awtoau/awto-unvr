[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "truenas-pylicensed"
version = "27.0.0"
description = "Clean-room no-licence stand-in for TrueNAS truenas_pylicensed (awto-unvr #356)"
requires-python = ">=3.11"
license = {text = "GPL-2.0-or-later"}

[tool.setuptools]
packages = ["truenas_pylicensed"]
