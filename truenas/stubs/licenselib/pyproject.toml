[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "licenselib"
version = "27.0.0"
description = "Clean-room stand-in for TrueNAS licenselib: no legacy licence decodes (awto-unvr #356)"
requires-python = ">=3.11"
license = {text = "GPL-2.0-or-later"}

[tool.setuptools]
packages = ["licenselib"]
